<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sohbet</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--tx:#1d1d1b;--mu:#77756f;--ac:#4a5fd8;--on:#fff;--ln:#e4e2dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171a;--card:#212125;--tx:#ececea;--mu:#9a98a0;--ac:#8b9bff;--on:#14151f;--ln:#33333a}}
:root[data-theme="dark"]{--bg:#17171a;--card:#212125;--tx:#ececea;--mu:#9a98a0;--ac:#8b9bff;--on:#14151f;--ln:#33333a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input{font:inherit}
input{background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:9px 11px;min-width:0}
button{background:var(--ac);color:var(--on);border:0;border-radius:10px;padding:9px 13px;cursor:pointer}
.gate,.blk{height:100%;display:grid;place-items:center;text-align:center;padding:16px}
.box{width:min(320px,100%);display:grid;gap:10px}
.box h2{margin:0}.box p{margin:0;color:var(--mu);min-height:1.4em;font-size:13px}
#app{height:100%;display:flex;flex-direction:column}
header{padding:10px 14px;font-weight:600;border-bottom:1px solid var(--ln);background:var(--card)}
header small{color:var(--mu);font-weight:400;margin-left:6px}
#list{flex:1;overflow-y:auto;padding:12px}
.m{max-width:min(84%,520px);background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:8px 11px;margin-bottom:8px;overflow-wrap:anywhere}
.m b{display:block;font-size:12px;color:var(--ac)}
.m small{display:block;text-align:right;color:var(--mu);font-size:11px}
.md{display:block;max-width:100%;max-height:50vh;border-radius:10px;margin:4px 0}
.fl{background:var(--bg);color:var(--tx);border:1px solid var(--ln);text-align:left}
#bar{display:flex;gap:6px;padding:8px;border-top:1px solid var(--ln);background:var(--card)}
#tx{flex:1}
#at{background:var(--bg);color:var(--tx);border:1px solid var(--ln)}
.nt{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;background:var(--tx);color:var(--bg);padding:8px 12px;border-radius:10px;font-size:13px}
</style>
</head>
<body>
<script>
(()=>{
const $=s=>document.querySelector(s);

/* inceleme engeli */
let blocked=false,clean=0;
const block=()=>{if(blocked)return;blocked=true;clean=0;document.body.innerHTML='<div class="blk"><div><h1>Bu sayfa incelenemiyor</h1><p>İnceleme araçlarını kapatıp sayfayı yenileyin.</p></div></div>'};
setInterval(()=>{const t=performance.now();(function(){debugger})();if(performance.now()-t>150)block();else if(blocked&&++clean>=2)location.reload()},1000);
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{const k=(e.key||'').toLowerCase(),c=e.ctrlKey||e.metaKey,one=k.length===1;
if(k==='f12'||(c&&e.shiftKey&&one&&'ijc'.includes(k))||(c&&k==='u')||(e.metaKey&&e.altKey&&one&&'iju'.includes(k))){e.preventDefault();block()}});

/* ortak parçalar */
const note=m=>{const n=document.createElement('div');n.className='nt';n.textContent=m;document.body.append(n);setTimeout(()=>n.remove(),3000)};
const fmt=t=>new Date(typeof t==='number'?t:Date.now()).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
async function save(src,n){const a=document.createElement('a');a.href=src;a.download=String(n||'dosya').slice(0,200);document.body.append(a);a.click();a.remove()}
function bubble(m){
const d=document.createElement('div');d.className='m';
const w=document.createElement('b');w.textContent='Anonim';d.append(w);
const src=typeof m.u==='string'&&m.u.startsWith('blob:')?m.u:(/^[0-9a-f]{32}$/.test(m.a||'')?'/_blob/'+m.a:'');
let el;
if(m.k==='img'&&src){el=new Image();el.src=src;el.alt=''}
else if(m.k==='aud'&&src){el=document.createElement('audio');el.controls=true;el.src=src}
else if(m.k==='vid'&&src){el=document.createElement('video');el.controls=true;el.playsInline=true;el.src=src}
else if(m.k==='file'&&src){el=document.createElement('button');el.classList.add('fl');el.textContent='📄 '+String(m.n||'dosya').slice(0,120)+' · '+Math.ceil((+m.s||0)/1024)+' KB';el.onclick=()=>save(src,m.n)}
if(el){el.classList.add('md');d.append(el)}
if(m.t){const p=document.createElement('div');p.textContent=String(m.t).slice(0,2000);d.append(p)}
const t=document.createElement('small');t.textContent=fmt(m.ts);d.append(t);
return d}
function paint(ms){const l=$('#list');if(!l)return;const nb=l.scrollHeight-l.scrollTop-l.clientHeight<80;l.replaceChildren(...ms.map(bubble));if(nb)l.scrollTop=l.scrollHeight}
function shell(){document.body.innerHTML='<div id="app"><header>Sohbet<small>anonim</small></header><div id="list"></div><div id="bar"><button id="at" title="Dosya, fotoğraf, ses, video">📎</button><input id="tx" placeholder="Mesaj yaz…" maxlength="2000" autocomplete="off"><button id="sd">Gönder</button><input id="fi" type="file" multiple hidden></div></div>'}
function wire(post,up){
const send=()=>{const v=$('#tx').value.trim();if(!v)return;$('#tx').value='';post({k:'txt',t:v})};
$('#sd').onclick=send;$('#tx').onkeydown=e=>{if(e.key==='Enter')send()};
$('#at').onclick=()=>$('#fi').click();
$('#fi').onchange=async e=>{for(const f of e.target.files){
if(f.size>614400){note('Dosya 600 KB’tan büyük');continue}
try{const c=f.type,k=c.startsWith('image/')?'img':c.startsWith('audio/')?'aud':c.startsWith('video/')?'vid':'file';
post({k,n:f.name.slice(0,120),s:f.size,...await up(f)})}catch(x){note('Yüklenemedi')}}
e.target.value=''}}

/* gerçek sohbet */
async function login(pw){const r=await fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({a:'login',pw,sid})});if(r.status===401)return false;if(!r.ok)throw 0;const j=await r.json();return j.decoy?'decoy':j.token}
async function real(tok){
shell();let ms=[],bc={};
const H={'content-type':'application/json',authorization:'Bearer '+tok};
const api=b=>fetch('/api/chat',{method:'POST',headers:H,body:JSON.stringify(b)}).then(r=>{if(r.status===401){lock();throw 0}if(!r.ok)throw 0;return r.json()});
const draw=()=>paint(ms.map(m=>m.a&&bc[m.a]?{...m,u:bc[m.a]}:m));
const need=m=>{if(m.a&&!(m.a in bc)){bc[m.a]='';fetch('/api/chat?b='+m.a,{headers:H}).then(r=>r.ok?r.blob():Promise.reject()).then(b=>{bc[m.a]=URL.createObjectURL(b);draw()}).catch(()=>{delete bc[m.a]})}};
const poll=async()=>{try{const r=await fetch('/api/chat',{headers:H});if(r.status===401)return lock();if(!r.ok)throw 0;ms=await r.json();ms.forEach(need);draw()}catch(e){}};
poll();const iv=setInterval(poll,3000);un=()=>clearInterval(iv);
watch();
wire(m=>api({a:'send',m}).then(poll).catch(()=>note('Gönderilemedi')),async f=>{const d=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(',')[1]);r.onerror=no;r.readAsDataURL(f)});return {a:(await api({a:'up',d,c:f.type||'application/octet-stream'})).id}})}

/* sahte sohbet: her şey yalnızca bu cihazda kalır */
async function fake(){
shell();const n=Date.now();
let L=[];
try{const r=await fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({a:'decoy'})});if(r.ok)L=(await r.json()).map(([a,t])=>({k:'txt',t:String(t).slice(0,2000),ts:n-(+a||0)*6e4}))}catch(e){}
paint(L);watch();wire(x=>{L.push({ts:Date.now(),...x});paint(L)},async f=>({u:URL.createObjectURL(f)}))}

/* şifre kapısı */
let stage=1,on=false,last=0,un=null,sid='';
const LOCK_MS=10000;
const lock=()=>{on=false;try{typeof un==='function'&&un()}catch(e){}un=null;stage=1;gate()};
const arm=()=>{last=Date.now()};
['keydown','keyup','keypress','beforeinput','input','pointerdown','touchstart','click','scroll','wheel'].forEach(n=>addEventListener(n,arm,{capture:true,passive:true}));
setInterval(()=>{if(on&&Date.now()-last>=LOCK_MS)lock()},500);
const watch=()=>{on=true;arm()};
function gate(){
sid=[...crypto.getRandomValues(new Uint8Array(12))].map(x=>x.toString(16).padStart(2,'0')).join('');
document.body.innerHTML='<div class="gate"><div class="box"><h2 id="gt">Giriş</h2><input id="pw" type="password" autocomplete="off" placeholder="Şifre"><button id="go">Gir</button><p id="gm"></p></div></div>';
const go=async()=>{const v=$('#pw').value;$('#pw').value='';let t;
try{t=await login(v)}catch(e){return note('Bağlantı hatası veya çok fazla deneme')}
if(t==='decoy')return fake();
if(t)return real(t);
if(stage===1){stage=2;$('#gm').textContent='Şifre yanlış.'}else fake()};
$('#go').onclick=go;$('#pw').onkeydown=e=>{if(e.key==='Enter')go()};$('#pw').focus()}
gate();
})();
</script>
</body>
</html>
